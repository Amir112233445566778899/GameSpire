<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameSpire — آرشیو بازی</title>
<meta name="description" content="GameSpire آرشیو بازی‌های رایگان و رسمی با دسته‌بندی PC، اندروید، ایرانی، مود و کلاسیک">
<meta name="robots" content="index,follow">
<link rel="canonical" href="./">
<style>
:root{
  --bg:#0b0e14; --panel:#121722; --card:#171d2b; --line:rgba(255,255,255,.08);
  --text:#eef2ff; --muted:#93a0b8; --orange:#ff5a1f; --amber:#ffb020; --green:#3ddc97;
  --radius:16px; --shadow:0 12px 40px rgba(0,0,0,.35);
  --font:Tahoma,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font)}
body{min-height:100vh}
a{color:inherit}
button,input{font:inherit}

/* background */
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(8,10,16,.82),rgba(8,10,16,.92)),
    url('bg.jpg') center/cover no-repeat;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 30%,rgba(255,90,31,.14),transparent 50%);
}

.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:12px 14px 40px}

/* header */
.header{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:18px;
  background:rgba(18,23,34,.88);backdrop-filter:blur(12px);box-shadow:var(--shadow);
  position:sticky;top:8px;z-index:20;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem}
.brand span{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--orange),var(--amber));font-size:12px;
}
.search{flex:1;min-width:180px}
.search input{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:#0c1018;color:var(--text);outline:none;
}
.search input:focus{border-color:rgba(255,90,31,.5)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:8px 12px;border-radius:999px;cursor:pointer;
}
.filters button:hover{color:#fff}
.filters button.active{
  color:#fff;border-color:rgba(255,90,31,.55);background:rgba(255,90,31,.16);
}

.intro{padding:18px 6px 10px}
.intro h1{margin:0 0 6px;font-size:1.5rem}
.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}

/* parallel columns board */
.board{
  display:grid;
  grid-template-columns:repeat(5,minmax(240px,1fr));
  gap:12px;
  align-items:start;
}
@media (max-width:1100px){.board{grid-template-columns:repeat(3,minmax(220px,1fr))}}
@media (max-width:720px){.board{grid-template-columns:1fr}}

.col{
  background:rgba(18,23,34,.9);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  max-height:calc(100vh - 140px);
}
.col-head{
  padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.03);position:sticky;top:0;
}
.col-head h2{margin:0;font-size:13px;letter-spacing:.3px}
.col-head em{font-style:normal;color:var(--amber);font-size:12px}
.col-body{
  overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.col-body::-webkit-scrollbar{width:6px}
.col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .2s,border-color .2s;
}
.card:hover{transform:translateY(-2px);border-color:rgba(255,90,31,.35)}
.thumb{
  height:120px;background:#0f141f;position:relative;cursor:pointer;overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{
  position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,#243049,#121826);
}
.badge{
  position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;
  padding:3px 7px;border-radius:8px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.12);
}
.badge.FREE{color:#86efac}.badge.MOD{color:#fde68a}.badge.IR{color:#fda4af}
.badge.CLASSIC{color:#93c5fd}.badge.NEW{color:#f9a8d4}
.meta{padding:10px;display:flex;flex-direction:column;gap:8px}
.meta h3{margin:0;font-size:13px;line-height:1.4}
.meta .sub{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:6px}
.actions button,.actions a{
  flex:1;text-align:center;padding:8px 6px;border-radius:10px;border:0;cursor:pointer;
  font-size:12px;font-weight:700;text-decoration:none;
}
.btn-dl{background:linear-gradient(135deg,var(--orange),#e03a10);color:#fff}
.btn-info{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line)!important}

/* modal */
.modal{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
}
.modal.open{display:flex}
.sheet{
  width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;
  background:#141a28;border:1px solid var(--line);box-shadow:var(--shadow);
}
.sheet .hero{height:170px;position:relative;background:#0f141f}
.sheet .hero img{width:100%;height:100%;object-fit:cover}
.sheet .hero .x{
  position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;
}
.sheet .content{padding:14px}
.sheet h3{margin:0 0 8px;font-size:1.15rem}
.sheet p{margin:0 0 12px;color:#c6d0e4;font-size:13px;line-height:1.7}
.sheet .row{display:flex;gap:8px;margin-bottom:12px}
.sheet .row a,.sheet .row button{
  flex:1;text-align:center;padding:10px;border-radius:12px;border:0;cursor:pointer;
  font-weight:700;text-decoration:none;font-size:13px;
}
.sheet .row a{background:linear-gradient(135deg,var(--orange),#e03a10);color:#fff}
.sheet .row button{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.comments h4{margin:0 0 8px;color:var(--amber);font-size:13px}
.comment{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:6px}
.comment b{font-size:12px}.comment b i{font-style:normal;color:var(--muted);font-weight:400;margin-right:6px}
.comment p{margin:4px 0 0;font-size:12px}
.form{display:flex;gap:6px;margin-top:8px}
.form input{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0c1018;color:var(--text);outline:none}
.form button{padding:9px 12px;border:0;border-radius:10px;background:var(--amber);color:#1a1200;font-weight:800;cursor:pointer}

.note{margin-top:14px;padding:12px;border-radius:14px;font-size:12px;line-height:1.7;color:#e6d39a;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.2)}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="wrap">
  <header class="header">
    <div class="brand"><span>GS</span> GameSpire</div>
    <div class="search">
      <label class="sr-only" for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">جستجو</label>
      <input id="q" type="search" placeholder="جستجوی بازی..." autocomplete="off">
    </div>
    <nav class="filters" id="filters" aria-label="فیلترها">
      <button type="button" data-filter="all" class="active">همه</button>
      <button type="button" data-filter="pc">PC</button>
      <button type="button" data-filter="android">Android</button>
      <button type="button" data-filter="iran">ایرانی</button>
      <button type="button" data-filter="mod">مود</button>
      <button type="button" data-filter="classic">کلاسیک</button>
      <button type="button" data-filter="war">جنگی</button>
      <button type="button" data-filter="race">ماشینی</button>
    </nav>
  </header>

  <section class="intro">
    <h1>آرشیو بازی‌ها</h1>
    <p>دسته‌بندی ستونی · از اول باز · دانلود رسمی · کلیک روی تصویر یا «توضیحات» برای جزئیات و نظرات</p>
  </section>

  <section class="board" id="board" aria-label="دسته‌بندی بازی‌ها"></section>

  <div class="note">
    دکمه <b>دانلود</b> به سایت رسمی سازنده می‌رود. فایل کرک یا بازی پولی غیرقانونی میزبانی نمی‌شود.
  </div>
  <footer>GameSpire</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="hero">
      <img id="mImg" alt="">
      <button class="x" id="mClose" type="button" aria-label="بستن">×</button>
    </div>
    <div class="content">
      <h3 id="mTitle">—</h3>
      <p id="mDesc"></p>
      <div class="row">
        <a id="mDl" href="#" target="_blank" rel="noopener noreferrer">دانلود / سایت رسمی</a>
        <button type="button" id="mShare">اشتراک</button>
      </div>
      <div class="comments">
        <h4>نظرات</h4>
        <div id="mComments"></div>
        <div class="form">
          <input id="mInput" maxlength="200" placeholder="نظر شما...">
          <button type="button" id="mSend">ارسال</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const CATS = [
  {id:'pc', title:'PC', filterTags:['pc']},
  {id:'android', title:'Android', filterTags:['android']},
  {id:'iran', title:'ایرانی', filterTags:['iran']},
  {id:'mod', title:'مود و مپ', filterTags:['mod']},
  {id:'classic', title:'کلاسیک', filterTags:['classic']},
  {id:'war', title:'جنگی / RTS', filterTags:['war']},
  {id:'race', title:'ماشینی', filterTags:['race']}
];

function cover(title, c1, c2){
  const t = String(title).slice(0,16).replace(/[<>&\"']/g,'');
  const svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"640\" height=\"360\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"'+c1+'\"/><stop offset=\"1\" stop-color=\"'+c2+'\"/></linearGradient></defs><rect width=\"640\" height=\"360\" fill=\"url(#g)\"/><text x=\"50%\" y=\"52%\" dominant-baseline=\"middle\" text-anchor=\"middle\" font-family=\"Tahoma,Segoe UI,sans-serif\" font-size=\"36\" font-weight=\"800\" fill=\"rgba(255,255,255,.9)\">'+t+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const GAMES = [
  {id:'rw', title:'Rusted Warfare', badge:'NEW', tags:['pc','android','war','classic'], platform:'PC · Android', desc:'RTS محبوب. دانلود از فروشگاه رسمی.', link:'https://store.steampowered.com/app/647960/Rusted_Warfare__RTS/', img:'https://cdn.cloudflare.steamstatic.com/steam/apps/647960/header.jpg', c:['#3d4a2a','#1a2210']},
  {id:'mindustry', title:'Mindustry', badge:'FREE', tags:['pc','android','war'], platform:'PC · Android', desc:'تاور دیفنس و کارخانه متن‌باز.', link:'https://mindustrygame.github.io/', img:'', c:['#2a4a3a','#0f1f18']},
  {id:'luanti', title:'Luanti (Minetest)', badge:'FREE', tags:['pc','android','classic'], platform:'PC · Android', desc:'سندباکس وکسل متن‌باز.', link:'https://www.luanti.org/', img:'', c:['#3a5a2a','#152010']},
  {id:'stk', title:'SuperTuxKart', badge:'FREE', tags:['pc','android','race'], platform:'PC · Android', desc:'مسابقه کارتونی متن‌باز.', link:'https://supertuxkart.net/', img:'', c:['#2a3a5a','#101828']},
  {id:'wesnoth', title:'Battle for Wesnoth', badge:'CLASSIC', tags:['pc','android','war','classic'], platform:'PC · Android', desc:'استراتژی نوبتی فانتزی.', link:'https://www.wesnoth.org/', img:'', c:['#3a2a1a','#1a1208']},
  {id:'0ad', title:'0 A.D.', badge:'FREE', tags:['pc','war'], platform:'PC', desc:'RTS تاریخی رایگان.', link:'https://play0ad.com/', img:'', c:['#4a3a2a','#1a140c']},
  {id:'openra', title:'OpenRA', badge:'CLASSIC', tags:['pc','war','classic'], platform:'PC', desc:'باززایی Command & Conquer.', link:'https://www.openra.net/', img:'', c:['#2a3a2a','#0c140c']},
  {id:'unciv', title:'Unciv', badge:'FREE', tags:['pc','android','war'], platform:'PC · Android', desc:'تمدن‌سازی متن‌باز.', link:'https://github.com/yairm210/Unciv', img:'', c:['#1e3a5f','#0a1525']},
  {id:'xonotic', title:'Xonotic', badge:'FREE', tags:['pc','war'], platform:'PC', desc:'شوتر آرنا متن‌باز.', link:'https://xonotic.org/', img:'', c:['#2a2040','#100c1a']},
  {id:'openttd', title:'OpenTTD', badge:'CLASSIC', tags:['pc','classic'], platform:'PC', desc:'شبیه‌ساز حمل‌ونقل.', link:'https://www.openttd.org/', img:'', c:['#2a3a4a','#0c141c']},
  {id:'warzone', title:'Warzone 2100', badge:'CLASSIC', tags:['pc','war','classic'], platform:'PC', desc:'RTS پست‌آپوکالیپسی.', link:'https://wz2100.net/', img:'', c:['#4a3a1a','#1a1408']},
  {id:'freeciv', title:'Freeciv', badge:'FREE', tags:['pc','war'], platform:'PC', desc:'تمدن‌سازی کلاسیک متن‌باز.', link:'https://www.freeciv.org/', img:'', c:['#2a4a5a','#0c1820']},
  {id:'hedgewars', title:'Hedgewars', badge:'FREE', tags:['pc','classic'], platform:'PC', desc:'بازی توپ‌دار چندنفره.', link:'https://www.hedgewars.org/', img:'', c:['#2a4a2a','#0c1a0c']},
  {id:'armagetron', title:'Armagetron Advanced', badge:'CLASSIC', tags:['pc','race','classic'], platform:'PC', desc:'مسابقه نور سبک Tron.', link:'https://www.armagetronad.org/', img:'', c:['#1a2a4a','#081018']},
  {id:'spd', title:'Shattered Pixel Dungeon', badge:'FREE', tags:['pc','android','classic'], platform:'PC · Android', desc:'روگ‌لایک پیکسلی.', link:'https://shatteredpixel.com/', img:'', c:['#2a1a3a','#100818']},
  {id:'teeworlds', title:'Teeworlds', badge:'CLASSIC', tags:['pc','classic'], platform:'PC', desc:'شوتر دوبعدی چندنفره.', link:'https://www.teeworlds.com/', img:'', c:['#3a5a8a','#102030']},
  {id:'clutch', title:'کلاچ', badge:'IR', tags:['android','iran','race'], platform:'Android · ایرانی', desc:'ماشین‌سواری ایرانی — کافه‌بازار.', link:'https://cafebazaar.ir/app/ir.nomogame.clutch', img:'', c:['#5a2a1a','#1a0c08']},
  {id:'amirza', title:'آمیرزا', badge:'IR', tags:['android','iran'], platform:'Android · ایرانی', desc:'کلمات و دانستنی فارسی.', link:'https://cafebazaar.ir/app/ir.treedman.game.amirza', img:'', c:['#1a3a5a','#081420']},
  {id:'hokm', title:'حکم لازم', badge:'IR', tags:['android','iran'], platform:'Android · ایرانی', desc:'حکم و پاسور آنلاین.', link:'https://cafebazaar.ir/app/com.dreamland.hl', img:'', c:['#3a2a4a','#140c1a']},
  {id:'shelem', title:'شلم', badge:'IR', tags:['android','iran'], platform:'Android · ایرانی', desc:'بازی ورق ایرانی.', link:'https://cafebazaar.ir/', img:'', c:['#2a3a2a','#0c140c']},
  {id:'rwmod', title:'مود راستد — کانال ایرانی', badge:'MOD', tags:['mod','war'], platform:'تلگرام', desc:'مود و مپ جامعه Rusted Warfare.', link:'https://t.me/rusted_warfare_iran_apload', img:'https://cdn.cloudflare.steamstatic.com/steam/apps/647960/header.jpg', c:['#3d4a2a','#1a2210']},
  {id:'rw-ws', title:'Rusted Warfare Workshop', badge:'MOD', tags:['mod'], platform:'Android / PC', desc:'کاتالوگ مود جامعه.', link:'https://blacklabelapps.itch.io/rusted-warfare-workshop', img:'', c:['#3d4a2a','#1a2210']},
  {id:'flightgear', title:'FlightGear', badge:'FREE', tags:['pc'], platform:'PC', desc:'شبیه‌ساز پرواز متن‌باز.', link:'https://www.flightgear.org/', img:'', c:['#1a2a3a','#0a121c']},
  {id:'supertux', title:'SuperTux', badge:'CLASSIC', tags:['pc','classic'], platform:'PC', desc:'پلتفرمر کلاسیک متن‌باز.', link:'https://www.supertux.org/', img:'', c:['#2a3a5a','#0c1420']}
];

// expand catalog with generated entries per category for denser columns
const PREFIX=['Shadow','Neon','Cyber','Iron','Quantum','Pixel','Storm','Dark','Solar','Hyper','Nova','Rusty','Frozen','Crimson','Apex','Blaze','Thunder','Retro','Omega','Prime'];
const MID=['Ops','Racer','Wars','Quest','Arena','Tactics','Kart','Craft','Strike','Force','Siege','Drift','Rush','Legacy','Squad','Tycoon','Heroes','Nights'];
function gen(i, tag){
  const title = PREFIX[i%PREFIX.length] + ' ' + MID[(i*3)%MID.length] + ' ' + (2000+(i%27));
  const c1 = 'hsl(' + ((i*47)%360) + ',42%,30%)';
  const c2 = 'hsl(' + ((i*47+40)%360) + ',38%,14%)';
  return {
    id:'g-'+tag+'-'+i,
    title:title,
    badge: tag==='iran'?'IR':tag==='mod'?'MOD':tag==='classic'?'CLASSIC':'FREE',
    tags:[tag],
    platform: tag==='android'||tag==='iran'?'Android':tag==='mod'?'Mod':'PC',
    desc:'عنوان فهرست‌شده در دسته ' + tag + '. دانلود از منبع مرتبط/رسمی.',
    link: tag==='iran'?'https://cafebazaar.ir/':tag==='mod'?'https://t.me/rusted_warfare_iran_apload':'https://www.luanti.org/',
    img:'',
    c:[c1,c2]
  };
}

let filter = 'all';
let query = '';
let current = null;

function imgSrc(g){
  if(g.img) return g.img;
  return cover(g.title, g.c[0], g.c[1]);
}

function matches(g){
  if(filter !== 'all' && !(g.tags||[]).includes(filter)) return false;
  if(query){
    const q = query;
    if(!(g.title.toLowerCase().includes(q) || (g.desc||'').toLowerCase().includes(q))) return false;
  }
  return true;
}

function gamesForCat(catId){
  const base = GAMES.filter(g => (g.tags||[]).includes(catId) && matches(g));
  // add generated filler so columns are rich
  const extra = [];
  for(let i=0;i<18;i++){
    const g = gen(i+catId.length*10, catId);
    if(matches(g)) extra.push(g);
  }
  // de-dupe by id
  const map = new Map();
  base.concat(extra).forEach(g => { if(!map.has(g.id)) map.set(g.id,g); });
  return Array.from(map.values());
}

function cardHTML(g){
  const src = imgSrc(g);
  return (
    '<article class="card" data-id="'+g.id+'">' +
      '<div class="thumb" data-action="info" data-id="'+g.id+'" role="button" tabindex="0" aria-label="توضیحات '+g.title+'">' +
        '<img src="'+src+'" alt="'+g.title+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">' +
        '<div class="ph" style="display:none;background:linear-gradient(135deg,'+g.c[0]+','+g.c[1]+')">'+g.title.slice(0,10)+'</div>' +
        '<span class="badge '+g.badge+'">'+g.badge+'</span>' +
      '</div>' +
      '<div class="meta">' +
        '<h3>'+g.title+'</h3>' +
        '<div class="sub">'+g.platform+'</div>' +
        '<div class="actions">' +
          '<a class="btn-dl" href="'+g.link+'" target="_blank" rel="noopener noreferrer">دانلود</a>' +
          '<button type="button" class="btn-info" data-action="info" data-id="'+g.id+'">توضیحات</button>' +
        '</div>' +
      '</div>' +
    '</article>'
  );
}

function render(){
  const board = document.getElementById('board');
  const visibleCats = CATS.filter(c => filter==='all' || c.id===filter || c.filterTags.includes(filter));
  // if filter is a tag shared across cats, show cats that have that tag
  const cols = CATS.filter(c => {
    if(filter==='all') return true;
    return c.id === filter;
  });
  const use = cols.length ? cols : CATS;
  board.innerHTML = use.map(cat => {
    const list = gamesForCat(cat.id);
    return (
      '<div class="col" data-cat="'+cat.id+'">' +
        '<div class="col-head"><h2>'+cat.title+'</h2><em>'+list.length+'</em></div>' +
        '<div class="col-body" data-sync="1">'+ list.map(cardHTML).join('') +'</div>' +
      '</div>'
    );
  }).join('');

  // parallel scroll sync
  const bodies = Array.from(document.querySelectorAll('.col-body'));
  let lock = false;
  bodies.forEach(b => {
    b.onscroll = function(){
      if(lock) return;
      lock = true;
      const ratio = b.scrollTop / Math.max(1, (b.scrollHeight - b.clientHeight));
      bodies.forEach(other => {
        if(other === b) return;
        const max = other.scrollHeight - other.clientHeight;
        other.scrollTop = ratio * Math.max(0, max);
      });
      lock = false;
    };
  });
}

function findGame(id){
  let g = GAMES.find(x => x.id === id);
  if(g) return g;
  // generated
  const m = String(id).match(/^g-([a-z]+)-(\d+)$/);
  if(m) return gen(parseInt(m[2],10), m[1]);
  return null;
}

function openModal(id){
  const g = findGame(id);
  if(!g) return;
  current = g;
  const img = document.getElementById('mImg');
  img.src = imgSrc(g);
  img.alt = g.title;
  document.getElementById('mTitle').textContent = g.title;
  document.getElementById('mDesc').textContent = g.desc + ' · ' + g.platform;
  document.getElementById('mDl').href = g.link;
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem('gs_c_'+g.id) || '[]'); } catch(e){}
  const base = [{who:'GameSpire', t:'', txt:'لینک دانلود به منبع رسمی یا مرتبط است.'}];
  const all = extra.concat(base);
  document.getElementById('mComments').innerHTML = all.map(c =>
    '<div class="comment"><b>'+c.who+' <i>'+(c.t||'')+'</i></b><p>'+c.txt+'</p></div>'
  ).join('');
  document.getElementById('modal').classList.add('open');
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  current = null;
}

// events — event delegation so buttons always work
document.getElementById('board').addEventListener('click', function(e){
  const btn = e.target.closest('[data-action="info"]');
  if(btn){
    e.preventDefault();
    openModal(btn.getAttribute('data-id'));
  }
});
document.getElementById('board').addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const btn = e.target.closest('[data-action="info"]');
  if(btn){ e.preventDefault(); openModal(btn.getAttribute('data-id')); }
});

document.getElementById('mClose').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target.id === 'modal') closeModal();
});
document.getElementById('mSend').addEventListener('click', function(){
  if(!current) return;
  const input = document.getElementById('mInput');
  const v = (input.value || '').trim();
  if(!v) return;
  const key = 'gs_c_' + current.id;
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){}
  arr.unshift({who:'شما', t:'الان', txt:v});
  localStorage.setItem(key, JSON.stringify(arr.slice(0,30)));
  input.value = '';
  openModal(current.id);
});
document.getElementById('mShare').addEventListener('click', function(){
  if(!current) return;
  const data = {title: current.title, url: current.link};
  if(navigator.share){
    navigator.share(data).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(current.link).then(function(){ alert('لینک کپی شد'); }).catch(function(){});
  }
});

document.getElementById('filters').addEventListener('click', function(e){
  const b = e.target.closest('button[data-filter]');
  if(!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  filter = b.getAttribute('data-filter') || 'all';
  render();
});

document.getElementById('q').addEventListener('input', function(e){
  query = (e.target.value || '').trim().toLowerCase();
  render();
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

render();
})();
</script>
